<form method="post" action="{{ url_for('bf_run_prestart',truck_id=truck.id) }}" class="bf-form">
<input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="date" value="{{ run_date }}"><input type="hidden" name="submission_token" value="{{ submission_token }}">
<label>Odometer (km)<input type="number" min="0" max="99999999" step="0.01" name="reading" required inputmode="decimal"></label>
{% for key,label,na in checks %}<div class="bf-prestart-check"><label>{{ loop.index }}. {{ label }}<select name="check_{{ key }}" required data-prestart-check><option value="">Choose result</option><option value="pass">Pass</option><option value="fail">Fail — report defect</option>{% if na %}<option value="na">Not fitted / not applicable</option>{% endif %}</select></label><label data-defect-note hidden>Defect details<textarea name="note_{{ key }}" maxlength="500" rows="2"></textarea></label></div>{% endfor %}
<label>Are you fit for duty?<select name="fit_for_duty" required><option value="">Choose answer</option><option value="yes">Yes</option><option value="no">No — do not start</option></select></label><label>Additional notes / fitness concerns<textarea name="notes" maxlength="2000" rows="2"></textarea></label>
<p class="bf-muted">{{ declaration }}</p><div class="bf-signature" data-signature><div class="bf-toolbar"><strong>Your signature</strong><button type="button" class="secondary compact" data-clear-signature>Clear</button></div><canvas width="600" height="200" aria-label="Draw your prestart signature"></canvas><input type="hidden" name="signature" value="[]"></div>
<label class="bf-check"><input type="checkbox" name="signed" value="yes" required><span>I completed these checks and confirm the declaration.</span></label><button class="primary bf-next">Save prestart & continue</button>
</form>
