<form method="post" enctype="multipart/form-data" action="{{ url_for('bf_run_prestart',truck_id=truck.id) }}" class="bf-form" data-truck-inspection data-draft="{{ g.user.id }}:{{ truck.id }}:{{ today }}:{{ workday.id if workday else 0 }}:{{ last_inspection }}:{{ driver_demo or 'live' }}">
<input type="hidden" name="csrf" value="{{ csrf_token() }}"><input type="hidden" name="date" value="{{ run_date }}"><input type="hidden" name="submission_token" value="{{ submission_token }}">
<div data-inspection-part="0"><label>Odometer (km)<input type="number" min="0" max="99999999" step="0.01" name="reading" required inputmode="decimal"></label>
</div>{% set paged=true %}{% include 'binflow/truck_checks.html' %}
<div data-inspection-part="2">
<label>Are you fit for duty?<select name="fit_for_duty" required><option value="">Choose answer</option><option value="yes">Yes</option><option value="no">No — do not start</option></select></label><div class="bf-inspection-info"><details data-fit-notes><summary>Add notes</summary><label>Notes or fitness concerns<textarea name="notes" maxlength="2000" rows="2"></textarea></label></details>
<details><summary>Read declaration</summary><p>{{ declaration }}</p></details></div><div class="bf-signature" data-signature><div class="bf-toolbar"><strong>Your signature</strong><button type="button" class="secondary compact" data-clear-signature>Clear</button></div><canvas width="600" height="200" aria-label="Draw your prestart signature"></canvas><input type="hidden" name="signature" value="[]"></div>
<label class="bf-check"><input type="checkbox" name="signed" value="yes" required><span>I completed these checks and confirm the declaration.</span></label><button class="primary bf-next">Save prestart & continue</button></div>
</form>
