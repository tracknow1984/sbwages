<section class="bf-panel bf-pad bf-finish-day"><form method="post" action="{{ url_for('bf_finish_workday',day_id=workday.id) }}" class="bf-form" data-clock-form><input type="hidden" name="csrf" value="{{ csrf_token() }}"><details><summary>Add work notes</summary><label>Notes<textarea name="notes" rows="2" maxlength="1000" placeholder="Anything the office needs to know"></textarea></label></details><button class="primary bf-next">Finish day</button></form>{% if current_user.role=='employee' and not driver_demo %}<p class="bf-muted">Saves your daily timesheet.</p>{% endif %}</section>
