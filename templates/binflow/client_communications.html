{% extends 'binflow/client_layout.html' %}
{% block content %}
<h1>Communication</h1>
<section class="bf-panel bf-pad">
  <h2>Contact a warehouse</h2>
  <form method="post" enctype="multipart/form-data" class="bf-form" action="{{ url_for('bf_client_communications') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="submission_key" value="{{ submission_key }}">
    <label>Send to warehouse<select name="state" required>
      <option value="">Choose a warehouse</option>
      {% for code,depot in warehouses.items() %}<option value="{{ code }}" {{ 'selected' if selected==code }}>{{ code }} · {{ depot[0] }}</option>{% endfor %}
    </select></label>
    <label>Message<textarea name="body" rows="4" maxlength="4000" required></textarea></label>
    {% include 'binflow/warehouse_attachment_field.html' %}
    <button class="primary" type="submit">Send communication</button>
  </form>
</section>
{% set staff=false %}{% include 'binflow/warehouse_enquiry_list.html' %}
{% endblock %}
