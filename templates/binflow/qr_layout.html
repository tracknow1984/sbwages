<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{{ b.code }} · BinFlow</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='binflow.css') }}"></head><body><header class="topbar"><span class="brand"><img class="brand-logo" src="{{ url_for('static',filename='sb-empire-header.webp') }}" alt="SB Empire" width="320" height="56"></span></header><main class="bf bf-public-qr">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}<header class="bf-heading"><div><span class="bf-kicker">BINFLOW · {{ b.size_name }}</span><h1>{{ b.code }}</h1>{% block subtitle %}{% endblock %}</div></header>{% block body %}{% endblock %}</main></body></html>
