<section class="bf-panel bf-pad"><form method="post" action="{{ url_for('bf_job_action',job_id=job.id,action='exchange') }}" enctype="multipart/form-data" class="bf-form">
<input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Handover confirmation<select name="confirmation" data-confirmation><option value="signed">Recipient signs</option><option value="not_present">Recipient not present</option><option value="declined">Recipient declined signature</option></select></label><label>Recipient name<input name="receiver_name" maxlength="150"></label><label>Notes (required if no signature)<textarea name="confirmation_note" maxlength="500" rows="2"></textarea></label>
<div class="bf-signature" data-signature><div class="bf-toolbar"><strong>Recipient signature</strong><button type="button" class="secondary compact" data-clear-signature>Clear</button></div><canvas width="600" height="200" aria-label="Draw recipient signature"></canvas><input type="hidden" name="signature" value="[]"></div><label>Collection photo (optional)<input type="file" name="photo" accept="image/jpeg,image/png,image/webp" capture="environment"></label><button class="primary bf-next">Complete client & continue →</button></form></section>
