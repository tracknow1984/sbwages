{% if workday and not workday.finished_at %}
<script src="{{ url_for('static',filename='binflow-lunch.js') }}" defer></script>
<script src="{{ url_for('static',filename='binflow-timer.js') }}" defer></script>
<div class="bf-shift-clock" data-shift-clock data-day="{{ workday.id }}" data-user="{{ g.user.id }}" data-alert-url="{{ url_for('bf_lunch_alerts') if not driver_demo else '' }}" data-csrf="{{ csrf_token() }}" data-started="{{ workday.started_at }}" data-server-now="{{ driver_server_now }}" data-break-started="{{ workday.break_started_at or '' }}" data-break-finished="{{ workday.break_finished_at or '' }}" data-clock-state="{{ url_for('bf_clock_state') }}"><small>Shift</small><strong data-elapsed>00:00:00</strong><span data-break-summary>Lunch at 4h</span></div>
<details class="bf-alert-settings"><summary>Lunch alert settings</summary>
<button type="button" class="secondary" data-test-sound>Test sound</button>
{% if not driver_demo %}<button type="button" class="secondary" data-enable-push>Enable phone alerts</button>{% endif %}
<small role="status" data-sound-status></small></details>
<section class="bf-break-banner bf-panel bf-pad" data-break-banner hidden aria-live="polite"><h2 data-break-title>Time for your 30-minute break</h2><p data-break-message>You started four hours ago. Park safely before taking your break.</p><form method="post" action="{{ url_for('bf_workday_break',day_id=workday.id,action='start') }}" data-break-start><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="primary bf-next">Start lunch · 30 min</button></form><form method="post" action="{{ url_for('bf_workday_break',day_id=workday.id,action='finish') }}" data-break-finish hidden><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="primary bf-next" disabled>Finish lunch</button></form></section>
{% endif %}
