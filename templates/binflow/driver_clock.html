{% if workday and not workday.finished_at %}
<script src="{{ url_for('static',filename='binflow-timer.js') }}" defer></script>
<div class="bf-shift-clock" data-shift-clock data-started="{{ workday.started_at }}" data-server-now="{{ driver_server_now }}" data-break-started="{{ workday.break_started_at or '' }}" data-break-finished="{{ workday.break_finished_at or '' }}" data-clock-state="{{ url_for('bf_clock_state') }}"><small>DAY TIMER</small><strong data-elapsed>00:00:00</strong><span data-break-summary>30 min break due after 4 hours</span></div>
<section class="bf-break-banner bf-panel bf-pad" data-break-banner hidden aria-live="polite"><h2 data-break-title>Time for your 30-minute break</h2><p data-break-message>You started four hours ago. Park safely before taking your break.</p><form method="post" action="{{ url_for('bf_workday_break',day_id=workday.id,action='start') }}" data-break-start><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="primary bf-next">Start 30-minute break</button></form><form method="post" action="{{ url_for('bf_workday_break',day_id=workday.id,action='finish') }}" data-break-finish hidden><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="primary bf-next" disabled>Finish break & continue</button></form></section>
{% endif %}
