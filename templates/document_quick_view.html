<link rel="stylesheet" href="{{ url_for('static',filename='document-preview.css') }}">
<dialog class="register-preview" aria-labelledby="preview-name">
  <div class="panel-head">
    <strong id="preview-name"></strong>
    <a data-open-preview target="_blank" rel="noopener">Open in new tab</a>
    <form method="dialog"><button autofocus class="secondary compact">Close</button></form>
  </div>
  <div class="preview-body"></div>
</dialog>
<script defer src="{{ url_for('static',filename='admin-document-preview.js') }}"></script>
