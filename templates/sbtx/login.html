{% extends 'sbtx/customer_base.html' %}
{% block browser_title %}SBTX customer sign in · SB Empire{% endblock %}
{% block content %}
<section class="panel form-panel"><h1>SBTX customer sign in</h1>
<p>Sign in to book transport jobs and upload purchase orders.</p>
{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Username<input name="username" value="{{ request.form.get('username','') }}" autocomplete="username" autocapitalize="none" maxlength="100" required></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" maxlength="200" required></label>
  <div class="actions"><button class="primary">Sign in</button></div>
</form></section>{% endblock %}
