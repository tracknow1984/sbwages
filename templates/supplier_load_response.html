<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Load response · SB Empire</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='binflow-interstate.css') }}"></head><body><main class="main"><section class="panel"><p>SB Empire · {{ load.recipient }}</p><h1>Transfer IT-{{ '%06d'|format(load.booking_id) }}</h1><p class="it-goods">{{ load.body }}</p>{% if load.decision %}<strong>{{ 'Approved by supplier' if load.decision=='approved' else 'Denied by supplier' }}</strong> · {{ load.decided_at|display_datetime }}{% else %}<form method="post" class="form-actions"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="primary" name="decision" value="approved">Approve</button><button class="secondary" name="decision" value="denied">Deny</button></form>{% endif %}</section></main></body></html>
