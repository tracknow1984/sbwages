{% extends 'base.html' %}{% block content %}<section class="auth-card"><span class="eyebrow">EMPLOYEE ACCOUNT</span><h1>Hi, {{ invitation.first_name }}.</h1><p class="muted">Set a password for <strong>{{ invitation.username }}</strong>.</p><form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Password<input name="password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required></label><label>Confirm password<input name="confirm_password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required></label><p class="hint">Use at least 12 characters.</p><button class="primary" type="submit">Set password</button></form></section>{% endblock %}
